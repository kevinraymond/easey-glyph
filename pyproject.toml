[project]
name = "easey-glyph"
version = "0.1.0"
description = "Audio-reactive generative visuals for live performance"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "tqdm>=4.67.3",
    "websocket-client>=1.9.0",
    "wsproto>=1.3.2",
]

[project.optional-dependencies]
midi = ["mido>=1.2.0", "python-rtmidi>=1.4.0"]
ndi = ["cyndilib"]
syphon = ["syphon-python"]
spout = ["SpoutGL"]
coreml = ["coremltools>=7.0"]
hf = ["safetensors>=0.4.0", "huggingface-hub>=0.20.0"]

[project.scripts]
easey-glyph = "easey_glyph.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easey_glyph = ["static/*"]
