model:
  image_size: 32
  in_channels: 16
  out_channels: 16
  base_channels: 96
  channel_mult: [1, 2, 4, 4]    # -> 96, 192, 384, 384 (~30M params)
  num_res_blocks: 2
  attention_resolutions: [4, 8]  # attention at 4x4 and 8x8
  use_depthwise_separable: false
  audio_dim: 12
  time_emb_dim: 128

training:
  batch_size: 64
  lr: 2.0e-4
  ema_decay: 0.9999
  total_kimg: 15000
  snap_kimg: 1000
  augment: ""
  smooth_reg_weight: 0.0
  smooth_reg_interval: 4
  fp16: true

data:
  path: "datasets/abstract-v2/glyph-abstract-v2-10k.pt"
  image_size: 32
